name: CI

on:
  # PRs run once (pull_request), not again on push, which is main-only, so a
  # push to a PR branch doesn't run CI twice. Main runs again after merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo by default (prune-caches alone
# raises its own token to actions: write). No step pushes or fetches private
# refs, so every checkout sets persist-credentials: false to keep the token
# out of .git/config.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI-only: line tables (not full debuginfo) shrink target/ and so the
  # rust-cache entries (faster restore, faster link); backtraces keep file:line.
  # The test profile inherits dev, so this covers test builds too.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Only main saves: branch caches (~640 MB each on Windows) would
        # otherwise evict main's from GitHub's 10 GB cache limit. Branches
        # still restore main's cache.
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Prebuilt binary; nextest runs the test binaries in parallel (cargo
      # test runs them one after another). Profile: .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149

      - name: Test (offline, deterministic)
        run: cargo nextest run --profile ci

      # nextest doesn't run doctests; none exist yet, so this guards new ones.
      - name: Doctests
        run: cargo test --doc

  # On Linux, gui-linux lints and tests the GUI crate and checks runs the
  # frontend checks.
  gui:
    name: gui build (windows-2025)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The pinned pnpm version lives in gui/package.json's "packageManager"
          # (there is no root package.json).
          package_json_file: gui/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Lint frontend (oxlint + e2e WebKit guard)
        working-directory: gui
        run: pnpm lint

      - name: Check frontend formatting (oxfmt)
        working-directory: gui
        run: pnpm format:check

      - name: Unit-test frontend (vitest)
        working-directory: gui
        run: pnpm test

      # Build the static frontend first: `cargo build -p rdm-gui` embeds
      # gui/dist via tauri::generate_context!, so it must exist beforehand.
      # `pnpm build` also typechecks the frontend (tsc).
      - name: Build frontend (tsc + vite)
        working-directory: gui
        run: pnpm build

      - name: Clippy GUI crate (deny warnings)
        run: cargo clippy -p rdm-gui --all-targets -- -D warnings

      - name: Build GUI crate
        run: cargo build -p rdm-gui

      # The root's default-members keep `cargo test` off rdm-gui; its tests
      # (e.g. log rotation) need gui/dist too, built above.
      - name: Test GUI crate
        run: cargo test -p rdm-gui

  # Its own job so the GUI crate's clippy and test builds stay off the e2e
  # critical path (e2e-build -> shards).
  gui-linux:
    name: gui crate (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Per runner image; see .github/scripts/apt-install-cached.sh.
      - name: Key the apt package cache by runner image
        id: image
        run: echo "key=build-apt-v1-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.image.outputs.key }}

      # Tauri's webview build deps (headers only: recommends aren't needed).
      - name: Install Linux webview build dependencies
        run: bash .github/scripts/apt-install-cached.sh --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json

      # Every Linux job lists the same lockfiles, so they share one pnpm cache
      # entry (prune-caches keeps only the newest per key prefix).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            gui/pnpm-lock.yaml
            gui/e2e/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      # The GUI crate embeds gui/dist, so it must exist first.
      - name: Build frontend (tsc + vite)
        working-directory: gui
        run: pnpm build

      - name: Clippy GUI crate (deny warnings)
        run: cargo clippy -p rdm-gui --all-targets -- -D warnings

      - name: Test GUI crate
        run: cargo test -p rdm-gui

  # Fast-fail frontend checks and dependency audits: Node and a prebuilt
  # cargo-audit only, no webview deps or Rust build.
  checks:
    name: gui checks + audits (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit@0.22.2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json

      # Every Linux job lists the same lockfiles, so they share one pnpm cache
      # entry (prune-caches keeps only the newest per key prefix).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            gui/pnpm-lock.yaml
            gui/e2e/pnpm-lock.yaml

      - name: Install frontend and e2e dependencies
        run: |
          pnpm --dir gui install --frozen-lockfile
          pnpm --dir gui/e2e install --frozen-lockfile

      - name: Lint frontend (oxlint + e2e WebKit and CI pin guards)
        working-directory: gui
        run: pnpm lint

      - name: Check frontend formatting (oxfmt)
        working-directory: gui
        run: pnpm format:check

      - name: Unit-test frontend (vitest)
        working-directory: gui
        run: pnpm test

      - name: Typecheck e2e suite
        working-directory: gui/e2e
        run: pnpm typecheck

      # Even after a failed check, so an advisory published upstream never
      # hides a check result (and vice versa).
      # Fails on vulnerabilities in the workspace Cargo.lock (engine, CLI and
      # GUI crate); unmaintained/unsound/yanked notices only warn. Called as
      # `cargo-audit audit`: `cargo audit` would make rustup install the
      # pinned toolchain, which this job doesn't otherwise need.
      - name: Audit Rust dependencies (cargo audit)
        if: ${{ !cancelled() }}
        run: cargo-audit audit

      # --prod: the runtime deps that ship in the GUI bundle, at any severity.
      # Dev tooling (vite, vitest) never ships and only runs locally/in CI.
      - name: Audit shipped frontend dependencies (pnpm audit)
        if: ${{ !cancelled() }}
        working-directory: gui
        run: pnpm audit --prod

  # Builds the debug app, fixture server and tauri-driver once for every e2e
  # shard.
  e2e-build:
    name: e2e build (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      # Also caches ~/.cargo/bin, so the tauri-driver install below is a no-op
      # on a warm cache. shared-key keeps the cache the single e2e job saved.
      - name: Cache cargo registry, build and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Per runner image; see .github/scripts/apt-install-cached.sh.
      - name: Key the apt package cache by runner image
        id: image
        run: echo "key=build-apt-v1-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.image.outputs.key }}

      # Tauri's webview build deps (headers only: recommends aren't needed).
      - name: Install Linux webview build dependencies
        run: bash .github/scripts/apt-install-cached.sh --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Save apt package cache
        if: ${{ github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.image.outputs.key }}

      # Built here and shipped to the shards with the app: there's no
      # prebuilt binary, and the cache makes this a no-op when warm.
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            gui/pnpm-lock.yaml
            gui/e2e/pnpm-lock.yaml

      - name: Install frontend and e2e dependencies
        run: |
          pnpm --dir gui install --frozen-lockfile
          pnpm --dir gui/e2e install --frozen-lockfile

      # The debug app with the frontend embedded (tauri build, whose
      # beforeBuildCommand typechecks and builds gui/dist), plus the loopback
      # fixture server the specs download from.
      - name: Build app and fixture server
        working-directory: gui/e2e
        run: pnpm run build

      # A tarball keeps the executable bits, which artifacts drop.
      - name: Pack e2e binaries
        run: |
          cp ~/.cargo/bin/tauri-driver target/debug/tauri-driver
          tar -cf e2e-bin.tar target/debug/rdm-gui target/debug/examples/fixture_server target/debug/tauri-driver

      - name: Upload e2e binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bin
          path: e2e-bin.tar
          retention-days: 1
          if-no-files-found: error

  # The webview e2e suite, split across shards by spec file (wdio --shard).
  # Each shard is its own runner, so its app state dir, fixture server and
  # tauri-driver port are its own.
  e2e:
    name: e2e (webview, ubuntu, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: e2e-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download e2e binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bin

      - name: Unpack e2e binaries
        run: tar -xf e2e-bin.tar

      # Per runner image; see .github/scripts/apt-install-cached.sh.
      - name: Key the apt package cache by runner image
        id: image
        run: echo "key=e2e-apt-v1-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.image.outputs.key }}

      # Runtime libraries only, plus WebKitWebDriver (the native driver
      # tauri-driver fronts on Linux) and a virtual display.
      # --no-install-recommends: the recommends pull in xdg-desktop-portal,
      # whose D-Bus activation stalls every app launch ~30 s on the runner.
      - name: Install Linux webview runtime, driver and display
        run: |
          bash .github/scripts/apt-install-cached.sh --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-common libxdo3 webkit2gtk-driver xvfb
          ! ldd target/debug/rdm-gui | grep "not found"

      - name: Save apt package cache
        if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.image.outputs.key }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            gui/pnpm-lock.yaml
            gui/e2e/pnpm-lock.yaml

      - name: Install e2e dependencies
        run: pnpm --dir gui/e2e install --frozen-lockfile

      - name: Run webview E2E shard (xvfb)
        working-directory: gui/e2e
        env:
          TAURI_DRIVER_PATH: ${{ github.workspace }}/target/debug/tauri-driver
        run: xvfb-run -a pnpm exec wdio run wdio.conf.ts --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The one check to require in branch protection: green only when every job
  # it needs succeeded, so the ruleset needn't track job or shard names.
  ci-ok:
    name: ci ok
    needs: [test, gui, gui-linux, checks, e2e-build, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # Main saves a fresh cache each run under a new key; GitHub only evicts an
  # entry after 7 days unused (or at the 10 GB limit, oldest first, which can
  # take main's newest). Keep only the newest entry per key prefix.
  # Its own job so the cache-deleting token never reaches build scripts or
  # tests. It needs every job that saves a cache, so this run's saves are
  # already the newest and are kept. It runs even if one failed: a failed job
  # saves nothing, so its prefix's newest is the previous entry, still kept.
  # Prefixes no current job uses are left to the 7-day eviction.
  prune-caches:
    name: prune stale caches (main)
    needs: [test, gui, gui-linux, checks, e2e-build, e2e]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Prune stale caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Prefix = key minus its trailing hash segments, e.g.
          #   v0-rust-e2e-Linux-x64-cdee7d24-19fb34bd -> v0-rust-e2e-Linux-x64
          #   node-cache-Linux-x64-pnpm-<64 hex>      -> node-cache-Linux-x64-pnpm
          stale_filter='
            map(. + {prefix: (.key | sub("(-[0-9a-f]{8,})+$"; ""))})
            | group_by(.prefix)[]
            | sort_by(.createdAt) | reverse | .[1:][]
            | "\(.id) \(.key)"'
          stale=$(gh cache list --ref refs/heads/main --limit 100 --json id,key,createdAt --jq "$stale_filter")
          if [ -z "$stale" ]; then
            echo "No stale caches."
            exit 0
          fi
          while read -r id key; do
            echo "Deleting $key"
            gh cache delete "$id"
          done <<< "$stale"

  live-smoke:
    name: live smoke (network, on demand)
    runs-on: ubuntu-24.04
    # Keep the default gate offline; run the real-network test only on manual
    # dispatch so PRs and pushes never hit a third-party host.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run ignored live smoke test
        run: cargo test -- --ignored

name: CI

on:
  # PRs run once (pull_request); main runs again after merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo by default (prune-caches alone
# raises its own token to actions: write). No step pushes or fetches private
# refs, so every checkout sets persist-credentials: false to keep the token
# out of .git/config.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI-only: line tables (not full debuginfo) shrink target/ and so the
  # rust-cache entries (faster restore, faster link); backtraces keep file:line.
  # The test profile inherits dev, so this covers test builds too.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows minutes bill at 2x, and the local gate already runs on
        # Windows before each push, so PRs run Linux only.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2025-vs2026"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Only main saves: branch caches (~640 MB each on Windows) would
        # otherwise evict main's from GitHub's 10 GB cache limit. Branches
        # still restore main's cache.
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Prebuilt binary; nextest runs the test binaries in parallel (cargo
      # test runs them one after another). Profile: .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149

      - name: Test (offline, deterministic)
        run: cargo nextest run --profile ci

      # nextest doesn't run doctests; none exist yet, so this guards new ones.
      - name: Doctests
        run: cargo test --doc

  # The Linux GUI checks run in the e2e job, which builds the same app anyway.
  gui:
    name: gui build (windows-2025)
    runs-on: windows-2025-vs2026
    # Windows-only and 2x billed: main and manual runs, not PRs.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # The pinned pnpm version lives in gui/package.json's "packageManager"
          # (there is no root package.json).
          package_json_file: gui/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Lint frontend (oxlint + e2e WebKit guard)
        working-directory: gui
        run: pnpm lint

      - name: Check frontend formatting (oxfmt)
        working-directory: gui
        run: pnpm format:check

      - name: Unit-test frontend (vitest)
        working-directory: gui
        run: pnpm test

      # Build the static frontend first: `cargo build -p rdm-gui` embeds
      # gui/dist via tauri::generate_context!, so it must exist beforehand.
      # `pnpm build` also typechecks the frontend (tsc).
      - name: Build frontend (tsc + vite)
        working-directory: gui
        run: pnpm build

      - name: Clippy GUI crate (deny warnings)
        run: cargo clippy -p rdm-gui --all-targets -- -D warnings

      - name: Build GUI crate
        run: cargo build -p rdm-gui

      # The root's default-members keep `cargo test` off rdm-gui; its tests
      # (e.g. log rotation) need gui/dist too, built above.
      - name: Test GUI crate
        run: cargo test -p rdm-gui

  # Also runs the dependency audits: this job already sets up pnpm and caches
  # ~/.cargo/bin, so they add seconds here instead of a separate job's minute.
  e2e:
    name: gui checks + e2e (webview, ubuntu)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      # Also caches ~/.cargo/bin, so the tauri-driver install below is a no-op
      # on a warm cache.
      - name: Cache cargo registry, build and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tauri's webview build deps, plus WebKitWebDriver
      # (the native driver tauri-driver fronts on Linux) and a virtual display.
      - name: Install Linux webview, driver and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev             libssl-dev             patchelf             webkit2gtk-driver             xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: gui/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            gui/pnpm-lock.yaml
            gui/e2e/pnpm-lock.yaml

      - name: Install frontend and e2e dependencies
        run: |
          pnpm --dir gui install --frozen-lockfile
          pnpm --dir gui/e2e install --frozen-lockfile

      - name: Lint frontend (oxlint + e2e WebKit guard)
        working-directory: gui
        run: pnpm lint

      - name: Check frontend formatting (oxfmt)
        working-directory: gui
        run: pnpm format:check

      - name: Unit-test frontend (vitest)
        working-directory: gui
        run: pnpm test

      - name: Typecheck e2e suite
        working-directory: gui/e2e
        run: pnpm typecheck

      # The debug app with the frontend embedded (tauri build, whose
      # beforeBuildCommand typechecks and builds gui/dist), plus the loopback
      # fixture server the specs download from.
      - name: Build app and fixture server
        working-directory: gui/e2e
        run: pnpm run build

      # gui/dist exists now, which the GUI crate embeds.
      - name: Clippy GUI crate (deny warnings)
        run: cargo clippy -p rdm-gui --all-targets -- -D warnings

      - name: Test GUI crate
        run: cargo test -p rdm-gui

      - name: Run webview E2E (xvfb)
        working-directory: gui/e2e
        run: xvfb-run -a pnpm test

      # Last, and even after a failed test step, so an advisory published
      # upstream never hides the test result (and vice versa).
      # Fails on vulnerabilities in the workspace Cargo.lock (engine, CLI and
      # GUI crate); unmaintained/unsound/yanked notices only warn.
      - name: Audit Rust dependencies (cargo audit)
        if: ${{ !cancelled() }}
        run: cargo audit

      # --prod: the runtime deps that ship in the GUI bundle, at any severity.
      # Dev tooling (vite, vitest) never ships and only runs locally/in CI.
      - name: Audit shipped frontend dependencies (pnpm audit)
        if: ${{ !cancelled() }}
        working-directory: gui
        run: pnpm audit --prod

  # Main saves a fresh cache each run under a new key; GitHub only evicts an
  # entry after 7 days unused (or at the 10 GB limit, oldest first, which can
  # take main's newest). Keep only the newest entry per key prefix.
  # Its own job so the cache-deleting token never reaches build scripts or
  # tests. It needs every job that saves a cache, so this run's saves are
  # already the newest and are kept. It runs even if one failed: a failed job
  # saves nothing, so its prefix's newest is the previous entry, still kept.
  # Prefixes no current job uses are left to the 7-day eviction.
  prune-caches:
    name: prune stale caches (main)
    needs: [test, gui, e2e]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Prune stale caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Prefix = key minus its trailing hash segments, e.g.
          #   v0-rust-e2e-Linux-x64-cdee7d24-19fb34bd -> v0-rust-e2e-Linux-x64
          #   node-cache-Linux-x64-pnpm-<64 hex>      -> node-cache-Linux-x64-pnpm
          stale_filter='
            map(. + {prefix: (.key | sub("(-[0-9a-f]{8,})+$"; ""))})
            | group_by(.prefix)[]
            | sort_by(.createdAt) | reverse | .[1:][]
            | "\(.id) \(.key)"'
          stale=$(gh cache list --ref refs/heads/main --limit 100 --json id,key,createdAt --jq "$stale_filter")
          if [ -z "$stale" ]; then
            echo "No stale caches."
            exit 0
          fi
          while read -r id key; do
            echo "Deleting $key"
            gh cache delete "$id"
          done <<< "$stale"

  live-smoke:
    name: live smoke (network, on demand)
    runs-on: ubuntu-24.04
    # Keep the default gate offline; run the real-network test only on manual
    # dispatch so it never gates everyday pushes.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run ignored live smoke test
        run: cargo test -- --ignored

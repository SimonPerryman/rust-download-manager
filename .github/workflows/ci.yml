name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test (offline, deterministic)
        run: cargo test

  gui:
    name: gui build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # Tauri's Linux webview/build system deps. No-op on Windows, which ships
      # WebView2. ubuntu-latest (24.04) provides webkit2gtk-4.1 / soup3 for
      # Tauri v2.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # The pinned pnpm version lives in gui/package.json's "packageManager"
          # (there is no root package.json).
          package_json_file: gui/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Lint frontend (oxlint)
        working-directory: gui
        run: pnpm lint

      - name: Check frontend formatting (oxfmt)
        working-directory: gui
        run: pnpm format:check

      - name: Unit-test frontend (vitest)
        working-directory: gui
        run: pnpm test

      # Build the static frontend first: `cargo build -p rdm-gui` embeds
      # gui/dist via tauri::generate_context!, so it must exist beforehand.
      # `pnpm build` also typechecks the frontend (tsc).
      - name: Build frontend (tsc + vite)
        working-directory: gui
        run: pnpm build

      - name: Clippy GUI crate (deny warnings)
        run: cargo clippy -p rdm-gui --all-targets -- -D warnings

      - name: Build GUI crate
        run: cargo build -p rdm-gui

  e2e:
    name: gui e2e (webview, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      # Also caches ~/.cargo/bin, so the tauri-driver install below is a no-op
      # on a warm cache.
      - name: Cache cargo registry, build and tools
        uses: Swatinem/rust-cache@v2

      # Tauri's webview build deps (as in the gui job), plus WebKitWebDriver
      # (the native driver tauri-driver fronts on Linux) and a virtual display.
      - name: Install Linux webview, driver and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev             libssl-dev             patchelf             webkit2gtk-driver             xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: gui/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            gui/pnpm-lock.yaml
            gui/e2e/pnpm-lock.yaml

      - name: Install frontend and e2e dependencies
        run: |
          pnpm --dir gui install --frozen-lockfile
          pnpm --dir gui/e2e install --frozen-lockfile

      - name: Typecheck e2e suite
        working-directory: gui/e2e
        run: pnpm typecheck

      # The debug app with the frontend embedded (tauri build), plus the
      # loopback fixture server the specs download from.
      - name: Build app and fixture server
        working-directory: gui/e2e
        run: pnpm run build

      - name: Run webview E2E (xvfb)
        working-directory: gui/e2e
        run: xvfb-run -a pnpm test

  live-smoke:
    name: live smoke (network, on demand)
    runs-on: ubuntu-latest
    # Keep the default gate offline; run the real-network test only on manual
    # dispatch so it never gates everyday pushes.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run ignored live smoke test
        run: cargo test -- --ignored

name: Bug report
description: Something in rdm doesn't work as it should, or it crashed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security problem, please don't open
        an issue: see the security policy instead.
  - type: input
    id: version
    attributes:
      label: rdm version
      description: >-
        The desktop app shows it on the first line of Copy diagnostics; the
        command line prints it with `rdm --version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: frontend
    attributes:
      label: Desktop app or command line?
      options:
        - Desktop app
        - Command line
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a download of …
        2. Pause it, then …
        3. See …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Desktop app: open Settings, then under Troubleshooting choose Copy
        diagnostics and paste here (if the window says "Something went
        wrong", use the Copy diagnostics button there). Command line: run
        the command again with `-v` (or with `RUST_LOG=debug` set) and paste
        the output. Links have their passwords and query strings removed,
        but site names and paths stay: check the text for anything private,
        such as site, file or folder names or a token in a link's path,
        before posting.
      render: text

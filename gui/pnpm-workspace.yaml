# pnpm settings for the GUI package. (In pnpm 10+ these live here, not in the
# package.json "pnpm" field.)
#
# pnpm blocks dependency build scripts by default and fails the install if any
# are left undecided. No dependency here needs one: Vite 8 bundles with
# Rolldown and ships its native binaries as optional packages, so nothing is
# allowed. Maintained via `pnpm approve-builds` / `pnpm install --allow-build`.
allowBuilds: {}

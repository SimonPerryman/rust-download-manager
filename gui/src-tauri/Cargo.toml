[package]
name = "rdm-gui"
version.workspace = true
edition = "2021"
description = "Tauri desktop frontend for rdm"
license = "MIT OR Apache-2.0"
publish = false
repository.workspace = true

# Released by tauri-action in the release workflow, not by dist.
[package.metadata.dist]
dist = false

# A library target so Tauri's mobile tooling and the binary share one entry
# point; the desktop binary is a thin `main` that calls into it.
[lib]
name = "rdm_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tests only (the e2e build turns it on): commands that panic, and the
# engine's `/__panic` download. Refuses to compile in a release build.
fault-injection = ["rdm/fault-injection"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rdm = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# Catching a panic in an async command (commands_guard.rs).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# The in-app updater. Its HTTP client shares the engine's reqwest/rustls (ring).
tauri-plugin-updater = "2"
# A pre-release build reads GitHub's releases list for the newest manifest;
# same reqwest and TLS setup as the engine.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Comparing versions for the updater's pre-release rule.
semver = "1"

[dev-dependencies]
# Signing the updater tests' fixture releases with a throwaway key.
base64 = "0.22"
minisign = "0.10"
tempfile = "3"
# A mock app handle for the updater tests.
tauri = { version = "2", features = ["test"] }
# Timers for the tests that drive the engine on their own runtime.
tokio = { version = "1", features = ["rt", "time"] }

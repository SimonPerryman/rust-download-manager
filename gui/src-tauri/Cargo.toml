[package]
name = "rdm-gui"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop frontend for rdm"
license = "MIT OR Apache-2.0"

# A library target so Tauri's mobile tooling and the binary share one entry
# point; the desktop binary is a thin `main` that calls into it.
[lib]
name = "rdm_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rdm = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

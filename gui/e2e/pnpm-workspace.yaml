# The webview E2E suite is its own pnpm root (own lockfile), so the GUI's
# install and CI jobs don't pull in WebdriverIO.
#
# esbuild (used by tsx to load the TypeScript config/specs) fetches its native
# binary in postinstall. The browser-driver downloaders WebdriverIO pulls in
# are not needed: tauri-driver fronts the platform's native webview driver.
allowBuilds:
  esbuild: true
  edgedriver: false
  geckodriver: false

# Security overrides for transitive dev dependencies, each scoped to the
# vulnerable range so other consumers keep their own versions. Drop an entry
# once the parent package ships the fix itself.
overrides:
  # GHSA-g3hv-75wg-m249 (patched only in 11.x). glob 14 is the first glob on
  # minimatch 11, and @wdio/config only calls its stable `sync()` API.
  "@wdio/config>glob": ^14.0.3
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  # GHSA-5c6j-r48x-rmvq, GHSA-qj8w-gfj5-8c6v, GHSA-m5mm-p8h7-m29v, via
  # mocha 10. The same major mocha 12 itself depends on.
  "serialize-javascript@<7.1.3": ^7.1.3
  # GHSA-c475-qrg2-pj4r, via get-uri (proxy-agent). 6.0's only breaking
  # change is a safer default (no separate FTP transfer host).
  "basic-ftp@<6.2.1": ^6.2.1

[workspace]
members = ["gui/src-tauri"]
default-members = ["."]
resolver = "2"

# One version for the CLI and the GUI: a tag vX.Y.Z releases both. The release
# workflow's version check holds gui/package.json and CHANGELOG.md to it.
[workspace.package]
version = "0.2.0"
repository = "https://github.com/SimonPerryman/rust-download-manager"
homepage = "https://github.com/SimonPerryman/rust-download-manager"

[package]
name = "rdm"
version.workspace = true
edition = "2021"
description = "A download manager in Rust"
license = "MIT OR Apache-2.0"
publish = false
repository.workspace = true
homepage.workspace = true

# Released by dist (see dist-workspace.toml) even though it's not on crates.io.
[package.metadata.dist]
dist = true

# Engine/CLI split: the engine lives in the library crate; `rdm` is a thin
# frontend binary that only calls it. Integration tests drive the library.
[lib]
name = "rdm"
path = "src/lib.rs"

[[bin]]
name = "rdm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
# TLS via rustls with the OS trust store (rustls-platform-verifier). The
# crypto provider is ring, installed by the engine, so the build skips
# aws-lc-rs and its C toolchain (cmake/NASM).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The engine emits events; each frontend installs its own subscriber.
tracing = "0.1"
# The CLI's stderr subscriber (`RUST_LOG`-filtered), and the engine's
# per-download log layer that a frontend adds to its subscriber.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"
# Only the test-only extras; Cargo unifies these with the `[dependencies]`
# tokio features (rt-multi-thread, macros, fs, io-util) for test builds.
tokio = { version = "1", features = ["net", "process", "test-util"] }
tempfile = "3"

# The profile dist builds the release archives with.
[profile.dist]
inherits = "release"
lto = "thin"
